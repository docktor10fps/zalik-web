<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f9faef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12140e" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,arrow_back,brightness_auto,check,checklist,chevron_right,dark_mode,delete,fitness_center,history,home,light_mode,logout,person,play_arrow,search,visibility,visibility_off&display=block">
    <title>Zalik</title>
    <script>
      // runs before the first paint; src/stores/theme.ts takes over once the app starts
      {
        const theme = localStorage.getItem('zalik_theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
